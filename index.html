<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UFC FOSS — Recruitment Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">

    <!-- Top Header -->
    <header class="top">
      <div class="brand">
        <img src="logo.png" alt="UFC FOSS Club Logo" class="brand-logo">
        <div class="brand-details">
          <div class="brand-title-row">
            <h1 class="brand-title">UFC FOSS CLUB</h1>
            <span class="sync-status-badge syncing" id="sync-status-badge" title="Live sync across all interviewers via Firebase Cloud DB">
              <span class="sync-dot" id="sync-dot"></span>
              <span id="sync-status-text">Connecting…</span>
            </span>
          </div>
          <span class="brand-sub">USAR &bull; Recruitment 2026</span>
        </div>
      </div>
      <div class="top-actions">
        <div class="reviewer-box" title="Enter your name to tag candidate decisions made by you">
          <span class="reviewer-label">Reviewer:</span>
          <input type="text" id="reviewer-name-input" class="reviewer-input" placeholder="Your Name" maxlength="20" spellcheck="false">
        </div>
        <button id="reset-decisions-btn" class="btn-action btn-reset hidden" title="Clear all saved selections and rejections across cloud and local">
          Reset All
        </button>
        <button id="export-selected-btn" class="btn-action btn-export" title="Export selected candidates to CSV">
          Export Selected (<span id="export-count">0</span>)
        </button>
        <label class="btn-action btn-import" for="csv-file-input" title="Import updated CSV from Google Forms">
          + Import CSV
        </label>
        <input type="file" id="csv-file-input" accept=".csv" hidden>
      </div>
    </header>

    <!-- Filter Tabs & Status Counters -->
    <div class="status-tabs">
      <button class="tab-btn active" data-tab="ALL">
        All <span class="tab-count" id="count-all">75</span>
      </button>
      <button class="tab-btn" data-tab="SELECTED">
        Selected <span class="tab-count tab-selected" id="count-selected">0</span>
      </button>
      <button class="tab-btn" data-tab="REJECTED">
        Rejected <span class="tab-count tab-rejected" id="count-rejected">0</span>
      </button>
      <button class="tab-btn" data-tab="PENDING">
        Pending <span class="tab-count" id="count-pending">75</span>
      </button>
    </div>

    <!-- Boxed Search Bar -->
    <div class="search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="search-input"
        placeholder="Search candidate by name, roll no, branch, tech stack, or keyword… (Press / to focus)"
        autocomplete="off"
        spellcheck="false"
      >
      <button id="clear-search" class="clear hidden" aria-label="Clear search">&times;</button>
    </div>
    <p class="meta" id="results-count">Showing all 75 candidates</p>

    <!-- Horizontal Candidate Tiles List -->
    <main id="cards-container" class="tiles-list"></main>

    <!-- Empty State -->
    <div id="empty-state" class="empty hidden">
      <p>No candidates found matching your search and filter criteria.</p>
    </div>

  </div>

  <!-- Detail Popup Modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden" tabindex="-1">
    <div class="modal-window">
      <!-- Modal Header -->
      <div class="modal-header">
        <div class="modal-head-info">
          <div class="modal-name-row">
            <h2 id="modal-name" class="modal-name">Candidate Name</h2>
            <span id="modal-status-badge" class="badge-status badge-pending">Pending</span>
          </div>
          <div class="modal-tags" id="modal-tags">
            <!-- Injected by JS: Branch, Year, Roll, Open Source status -->
          </div>
        </div>
        <button id="modal-close" class="modal-close-btn" aria-label="Close modal (Esc)">&times;</button>
      </div>

      <!-- Modal Body: Links & All 8 Questions -->
      <div class="modal-body">
        <!-- Quick Contact Links -->
        <div class="modal-links" id="modal-links">
          <!-- WhatsApp, Email, GitHub, Portfolio -->
        </div>

        <!-- Interviewer Feedback & Notes Box -->
        <div class="modal-notes-section">
          <div class="modal-notes-header">
            <div class="notes-header-title">
              <span class="notes-icon">📝</span>
              <strong>Feedback &amp; Interview Notes</strong>
              <span id="modal-note-author" class="note-author-tag"></span>
            </div>
            <span id="modal-note-status" class="note-save-status">Saved</span>
          </div>
          <textarea
            id="modal-note-input"
            class="modal-note-textarea"
            placeholder="Add interview feedback, notes, or evaluation comments here... (Auto-saves to cloud &amp; syncs to all devices)"
            rows="3"
            spellcheck="false"
          ></textarea>
        </div>

        <!-- All Questions -->
        <div class="modal-fields" id="modal-fields">
          <!-- Form question boxes injected by JS -->
        </div>
      </div>

      <!-- Modal Footer with Select & Reject Buttons -->
      <div class="modal-footer">
        <div class="modal-nav">
          <button id="modal-prev-btn" class="btn-nav" title="Previous candidate (Left Arrow)">&larr; Prev</button>
          <span id="modal-counter" class="modal-counter">1 / 75</span>
          <button id="modal-next-btn" class="btn-nav" title="Next candidate (Right Arrow)">Next &rarr;</button>
        </div>
        <div class="modal-decision-btns">
          <button id="modal-reject-btn" class="btn-decision btn-decision-reject">
            ✕ Reject
          </button>
          <button id="modal-select-btn" class="btn-decision btn-decision-select">
            ✓ Select
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Firebase Cloud Sync SDKs (Compat/CDN for zero-build real-time multi-device sync) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
