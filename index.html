<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UFC FOSS — Responses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">

    <header class="top">
      <div class="brand">
        <img src="logo.png" alt="UFC FOSS Club Logo" class="brand-logo">
        <div class="brand-details">
          <h1 class="brand-title">UFC FOSS CLUB</h1>
          <span class="brand-sub">USAR &bull; <span class="tally" id="count-badge">75</span> responses</span>
        </div>
      </div>
      <label class="import" for="csv-file-input">+ Import CSV</label>
      <input type="file" id="csv-file-input" accept=".csv" hidden>
    </header>

    <div class="search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        id="search-input"
        placeholder="Search name, roll no, branch, tech stack, or a response…"
        autocomplete="off"
        spellcheck="false"
      >
      <button id="clear-search" class="clear hidden" aria-label="Clear search">&times;</button>
    </div>
    <p class="meta" id="results-count">Showing all 75 candidates</p>

    <main id="cards-container" class="list"></main>

    <div id="empty-state" class="empty hidden">
      <p>Nothing matches that search.</p>
    </div>

  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
